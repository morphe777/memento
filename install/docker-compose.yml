# Mémento — stack de production (Portainer ou docker compose).
# Une seule image, trois conteneurs : API + interface web, worker (jobs planifiés), serveur MCP (IA).
# Données : bind vers le dossier MEMENTO_DATA_DIR de l'hôte (base SQLite memento.db, sauvegardes avant import).
# MEMENTO_DATA_DIR est obligatoire : le déploiement échoue s'il manque, plutôt que de démarrer sur un dossier vide.
# Réseau local / VPN uniquement : ne pas exposer sur Internet. Les ports sont publiés sur MEMENTO_BIND_IP (l'adresse
# du serveur sur le réseau local ; 127.0.0.1 par défaut : la machine seule).

x-memento: &memento
  # H-17: a fixed version, never « latest ». Update = change the version here; going back = put the previous one.
  image: morphe777/memento:1.0.0
  restart: unless-stopped
  environment: &env
    TZ: Europe/Paris
    MEMENTO_DB_FILE: /data/memento.db

services:
  memento:
    <<: *memento
    container_name: memento
    volumes: &data
      - ${MEMENTO_DATA_DIR:?Renseigner MEMENTO_DATA_DIR (dossier de donnees sur l'hote)}:/data
    ports:
      - "${MEMENTO_BIND_IP:-127.0.0.1}:4500:4500"
    environment:
      <<: *env
      MEMENTO_HOST: 0.0.0.0
      MEMENTO_API_PORT: "4500"
      # true derrière NGINX Proxy Manager en HTTPS (cookie de session « Secure »)
      MEMENTO_COOKIE_SECURE: "false"
      # Adresse (IP ou CIDR) du reverse proxy dont on croit l'en-tête X-Forwarded-For. Vide : la limite de
      # connexion compte l'adresse du proxy pour tous (plus strict, sans risque).
      MEMENTO_TRUST_PROXY: ${MEMENTO_TRUST_PROXY:-}
      # « Proposer avec l'IA » : la clé se saisit dans Configuration › IA. Facultatif : ces variables servent
      # de clé par défaut si aucune n'est saisie (Portainer › Environment variables). Jamais dans le dépôt.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MEMENTO_AI_API_KEY: ${MEMENTO_AI_API_KEY:-}
      MEMENTO_TELEGRAM_BOT_TOKEN: ${MEMENTO_TELEGRAM_BOT_TOKEN:-}

  memento-worker:
    <<: *memento
    container_name: memento-worker
    volumes: *data
    environment:
      <<: *env
      # Bilan du soir (D-77) : mêmes clés de repli que l'API, si rien n'est saisi dans Configuration.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MEMENTO_AI_API_KEY: ${MEMENTO_AI_API_KEY:-}
      MEMENTO_TELEGRAM_BOT_TOKEN: ${MEMENTO_TELEGRAM_BOT_TOKEN:-}
    command: ["node_modules/.bin/tsx", "apps/worker/src/index.ts"]
    healthcheck:
      disable: true
    depends_on:
      memento:
        condition: service_healthy

  memento-mcp:
    <<: *memento
    container_name: memento-mcp
    # M-31: the MCP server only relays to the API with the caller's token: no access to /data (database, keys).
    command: ["node_modules/.bin/tsx", "apps/mcp/src/index.ts"]
    ports:
      - "${MEMENTO_BIND_IP:-127.0.0.1}:4502:4502"
    environment:
      <<: *env
      MEMENTO_API_URL: http://memento:4500/api/v1
      MEMENTO_MCP_HOST: 0.0.0.0
      MEMENTO_MCP_PORT: "4502"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4502/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      memento:
        condition: service_healthy
