# H-17: automatic gate on every push and pull request. Publishing the image stays manual
# (install/build-and-push.sh, from a commit tagged vX.Y.Z).
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json « packageManager »
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, types, tests
        run: pnpm check
      - name: Tests on other days and in random order (H-15)
        run: pnpm test:dates
      - name: Dependencies without high advisory
        run: pnpm audit --audit-level high

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json « packageManager »
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser for the end-to-end tests (H-16)
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (real web UI, throw-away database)
        run: pnpm test:e2e
      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (not pushed)
        run: docker build --build-arg VERSION=ci -t memento:ci .
      - name: No personal or design files in the image, no test or dev tools (H-18)
        run: |
          docker run --rm --entrypoint sh memento:ci -c '
            test -f docs/api/guide-ia.md &&
            ! test -e maquettes && ! test -e memento-vue-plan && ! test -e data && ! test -e .git &&
            test "$(ls docs)" = "api" && test "$(ls docs/api)" = "guide-ia.md" &&
            ! test -e node_modules/.bin/vitest && ! test -e node_modules/.bin/biome && ! test -e apps/api/test &&
            test -x node_modules/.bin/tsx && test -f apps/web/dist/index.html'
      # D-136: the scan warns (listed in the log), it does not block: most findings come from the Debian base image.
      - name: Image scan (fixable high and critical vulnerabilities, warning only)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1
          image --exit-code 0 --severity HIGH,CRITICAL --ignore-unfixed --no-progress memento:ci
